name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # Die App muss unter Windows und Linux laufen: beide Systeme bauen, testen und fahren den
    # fensterlosen Selbsttest (Datenpfade, SQLite mit nativer Bibliothek, Instanzschutz, Sprachen).
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore MaxCube.slnx
      - name: Build
        run: dotnet build MaxCube.slnx --no-restore --nologo
      - name: Test
        run: dotnet test MaxCube.slnx --no-build --nologo --logger trx
      - name: Selbsttest der Desktop-App
        run: dotnet src/MaxCube.UI.Desktop/bin/Debug/net10.0/MaxCube.UI.Desktop.dll --selfcheck
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  publish:
    # Eigenständige Pakete (self-contained) für beide Systeme, damit kein .NET-SDK nötig ist.
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish ${{ matrix.rid }}
        run: dotnet publish src/MaxCube.UI.Desktop/MaxCube.UI.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=false -o publish/${{ matrix.rid }}
      - name: Selbsttest des veröffentlichten Pakets (Linux)
        if: matrix.rid == 'linux-x64'
        run: |
          chmod +x publish/linux-x64/MaxCube.UI.Desktop
          publish/linux-x64/MaxCube.UI.Desktop --selfcheck
      - name: Selbsttest des veröffentlichten Pakets (Windows)
        if: matrix.rid == 'win-x64'
        run: publish\win-x64\MaxCube.UI.Desktop.exe --selfcheck
      - uses: actions/upload-artifact@v7
        with:
          name: maxcube-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
